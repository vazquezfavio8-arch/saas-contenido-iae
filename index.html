<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contenido Express - Creador de Contenido IA</title>
  <style>
    :root {
      --primary: #8e7d73;
      --primary-hover: #75665c;
      --bg: #f4f4f4;
      --card-bg: #ffffff;
      --text: #333333;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); width: 100%; max-width: 500px; text-align: center; }
    h1 { font-size: 24px; margin-bottom: 8px; color: #1a1a1a; }
    p.subtitle { font-size: 14px; color: #666; margin-bottom: 24px; }
    .form-group { text-align: left; margin-bottom: 20px; }
    label { font-size: 12px; font-weight: bold; uppercase; color: #555; display: block; margin-bottom: 8px; letter-spacing: 0.5px; }
    select, input[type="file"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; background: #fafafa; outline: none; }
    select:focus { border-color: var(--primary); }
    button { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 25px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
    button:hover { background: var(--primary-hover); }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .status { margin-top: 15px; font-size: 13px; color: #666; display: none; }
    .status-text { display: inline-block; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
  </style>
</head>
<body>

  <div class="container">
    <h1>Contenido Express</h1>
    <p class="subtitle">Sube la foto de tu producto y Gemini hará el resto</p>
    
    <div class="form-group">
      <label for="tipoNegocio">TIPO DE NEGOCIO</label>
      <select id="tipoNegocio">
        <option value="Tienda de Ropa / Moda">Tienda de Ropa / Moda</option>
        <option value="Calzado y Accesorios">Calzado y Accesorios</option>
        <option value="Gastronomía y Alimentos">Gastronomía y Alimentos</option>
        <option value="Estética y Cuidado Personal">Estética y Cuidado Personal</option>
      </select>
    </div>
    
    <div class="form-group">
      <label for="fotoProducto">FOTO DEL PRODUCTO</label>
      <input type="file" id="fotoProducto" accept="image/*">
    </div>
    
    <button id="btnGenerar">✦ Generar Contenido Comercial</button>
    
    <div id="statusArea" class="status">
      <span class="status-text" id="statusMessage">Optimizando imagen... ⏳</span>
    </div>
  </div>

  <script>
    const fotoProducto = document.getElementById('fotoProducto');
    const tipoNegocio = document.getElementById('tipoNegocio');
    const btnGenerar = document.getElementById('btnGenerar');
    const statusArea = document.getElementById('statusArea');
    const statusMessage = document.getElementById('statusMessage');

    let base64Procesado = null;

    // Lógica integrada para comprimir imágenes pesadas tomadas con el cel al vuelo
    fotoProducto.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      statusArea.style.display = 'block';
      statusMessage.innerText = 'Optimizando dimensiones de imagen... 📸';
      btnGenerar.disabled = true;

      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = function(event) {
        const img = new Image();
        img.src = event.target.result;
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');

          // Resolución máxima equilibrada (Full HD estándar) para análisis visual óptimo
          const MAX_WIDTH = 1200;
          const MAX_HEIGHT = 1200;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }
          } else {
            if (height > MAX_HEIGHT) {
              width *= MAX_HEIGHT / height;
              height = MAX_HEIGHT;
            }
          }

          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          // Compresión de calidad al 75% en formato JPEG para destruir el exceso de peso muerto
          const dataUrlComprimida = canvas.toDataURL('image/jpeg', 0.75);
          base64Procesado = dataUrlComprimida.split(',')[1];

          statusArea.style.display = 'none';
          btnGenerar.disabled = false;
        };
      };
    });

    // Envío de datos al Backend en Vercel
    btnGenerar.addEventListener('click', async () => {
      if (!base64Procesado) {
        alert('Por favor, selecciona una foto primero.');
        return;
      }

      statusArea.style.display = 'block';
      statusMessage.innerText = 'Analizando imagen y redactando propuestas analíticas... 🐻';
      btnGenerar.disabled = true;

      try {
        const response = await fetch('/api/generar', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            imagenBase64: base64Procesado,
            tipoNegocio: tipoNegocio.value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Error desconocido en el servidor.');
        }

        // Aquí puedes renderizar el resultado directamente en tu HTML. Por simplicidad usamos alert temporal.
        alert("¡Contenido Generado con Éxito!\n\n" + data.resultado);

      } catch (error) {
        alert(error.message);
      } finally {
        statusArea.style.display = 'none';
        btnGenerar.disabled = false;
      }
    });
  </script>
</body>
</html>
