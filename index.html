<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contenido Express</title>
  <style>
    :root { --primary: #000; --accent: #0070f3; }
    body { font-family: -apple-system, sans-serif; background: #fff; padding: 20px; max-width: 500px; margin: auto; color: #333; }
    .card { border: 1px solid #eaeaea; padding: 25px; border-radius: 12px; }
    label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #888; }
    select, textarea, input { width: 100%; padding: 12px; margin: 8px 0 20px 0; border: 1px solid #eaeaea; border-radius: 8px; font-size: 14px; }
    .btn-group { display: flex; gap: 10px; }
    button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; color: #fff; }
    #btnMkt { background: var(--primary); }
    #btnIA { background: var(--accent); }
    #resultado { margin-top: 25px; padding: 20px; background: #f9f9f9; border-radius: 8px; white-space: pre-wrap; font-size: 14px; display: none; }
  </style>
</head>
<body>
  <h2>Contenido Express</h2>
  <div class="card">
    <label>Negocio</label>
    <select id="tipoNegocio"><option>Moda</option><option>Gastronomía</option></select>
    <label>Instrucciones</label>
    <textarea id="instrucciones" placeholder="Detalles extra..."></textarea>
    <label>Foto</label>
    <input type="file" id="foto" accept="image/*">
    <div class="btn-group">
      <button id="btnMkt" onclick="generar('marketing')">Marketing</button>
      <button id="btnIA" onclick="generar('prompts_visuales')">IA Visual</button>
    </div>
  </div>
  <div id="resultado"></div>

  <script>
    async function generar(modo) {
      const resDiv = document.getElementById('resultado');
      resDiv.style.display = 'block'; resDiv.innerText = "Procesando...";
      const file = document.getElementById('foto').files[0];
      const reader = new FileReader();
      reader.onload = async (e) => {
        const res = await fetch('/api/generar', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            imagenBase64: e.target.result.split(',')[1],
            tipoNegocio: document.getElementById('tipoNegocio').value,
            instrucciones: document.getElementById('instrucciones').value,
            modo: modo
          })
        });
        const data = await res.json();
        resDiv.innerText = data.resultado || data.error;
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
