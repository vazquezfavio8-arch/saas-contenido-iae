<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contenido Express Pro</title>
  <style>
    :root {
      --bg: #ffffff;
      --card: #f8f9fa;
      --text: #1a1a1a;
      --accent: #2d3436;
      --primary: #0984e3;
      --border: #dfe6e9;
    }
    body { 
      font-family: 'Inter', -apple-system, sans-serif; 
      background-color: var(--bg); 
      color: var(--text);
      line-height: 1.6;
      padding: 40px 20px;
      max-width: 600px;
      margin: auto;
    }
    h2 { font-weight: 700; letter-spacing: -0.5px; margin-bottom: 20px; }
    .card { 
      background: var(--card); 
      padding: 30px; 
      border-radius: 16px; 
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: #636e72; display: block; margin-bottom: 5px; }
    select, textarea, input { 
      width: 100%; padding: 12px; margin-bottom: 20px; 
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 1rem; outline: none; background: #fff;
    }
    .btn-container { display: flex; gap: 10px; }
    button { 
      flex: 1; padding: 14px; border-radius: 8px; border: none; 
      font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-secondary { background: var(--primary); color: white; }
    button:active { transform: scale(0.98); }
    #resultado { 
      margin-top: 30px; padding: 20px; 
      border-left: 4px solid var(--primary);
      background: #f1f7fd; border-radius: 0 8px 8px 0;
      white-space: pre-wrap; font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <h2>Contenido Express</h2>
  
  <div class="card">
    <label>Tipo de negocio</label>
    <select id="tipoNegocio">
      <option value="Tienda de Ropa / Moda">Moda y Ropa</option>
      <option value="Gastronomía">Gastronomía</option>
      <option value="Servicios Profesionales">Servicios</option>
    </select>

    <label>Instrucciones especiales</label>
    <textarea id="instrucciones" rows="3" placeholder="Ej: Usa un tono muy elegante, enfócate en la calidad de la tela..."></textarea>

    <label>Foto del producto</label>
    <input type="file" id="foto" accept="image/*">
    
    <div class="btn-container">
      <button class="btn-primary" onclick="generar('marketing')">Marketing</button>
      <button class="btn-secondary" onclick="generar('prompts_visuales')">IA Visual</button>
    </div>
  </div>

  <div id="resultado" style="display:none;"></div>

  <script>
    async function generar(modo) {
      const btn = document.querySelectorAll('button');
      btn.forEach(b => b.disabled = true);
      const resDiv = document.getElementById('resultado');
      resDiv.style.display = 'block';
      resDiv.innerText = "Procesando con IA...";

      const file = document.getElementById('foto').files[0];
      const reader = new FileReader();
      
      reader.onload = async (e) => {
        const base64 = e.target.result.split(',')[1];
        try {
          const res = await fetch('/api/generar', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              imagenBase64: base64,
              tipoNegocio: document.getElementById('tipoNegocio').value,
              instrucciones: document.getElementById('instrucciones').value,
              modo: modo
            })
          });
          const data = await res.json();
          resDiv.innerText = data.resultado || data.error;
        } catch (err) {
          resDiv.innerText = "Error: " + err.message;
        } finally {
          btn.forEach(b => b.disabled = false);
        }
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
